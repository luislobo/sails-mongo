name: Node.js CI

on:
  push:
    branches: [ master, 0.12.x, production ]
  pull_request:
    branches: [ master, 0.12.x, production ]

jobs:

  build:

    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3

      - name: Install dependencies
        run: npm i

      - run: npm test
        env:
          MONGODB_URI: "mongodb://mongodb:${{ job.services.mongodb.ports[27017] }}/test_db"
