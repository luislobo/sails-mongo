name: Run tests

on: [push]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [12, 14, 16, 18]
        mongodb-version: ['4.2', '4.4', '5.0']

    runs-on: ${{ matrix.os }}

    services:
      mongodb:
        # Docker Hub image
        image: mongo:${{ matrix.mongodb-version }}
        ports:
          - 27017:27017

    steps:
      - name: Git checkout
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: |
          npm config set send-metrics false
          npm install --no-audit --no-fund

      - name: MongoDB ${{ matrix.mongodb-version }} on ${{ matrix.os }}
      - run: npm test
        env:
          WATERLINE_ADAPTER_TESTS_URL: localhost/testdb
          WATERLINE_ADAPTER_TESTS_HOST: localhost
          WATERLINE_ADAPTER_TESTS_DATABASE: sails-mongo
          NODE_ENV: test
